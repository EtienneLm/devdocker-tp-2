name: CI
on:
    push:
        branches: [main]
        tags: ['v*']
    
jobs:
    ci:
        runs-on: ubuntu-latest
        env:
            DB_PASSWORD: secret
            DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
            TAG: ${{ github.ref_name }}
            POSTGRES_USER: user
            POSTGRES_PASSWORD: secret
            POSTGRES_DB: postgres

        steps:
            - uses: actions/checkout@v7
            - run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ vars.DOCKERHUB_USERNAME }} --password-stdin
            - run: docker compose up -d --wait db
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
            - working-directory: api
              run: npm ci && npm test
              env: 
                DATABASE_URL: postgres://user:${{ env.DB_PASSWORD }}@localhost:5432/postgres
            - run: docker compose -f compose.yaml build
            - run: |
                docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \ 
                -v trivy-cache:/root/.cache aquasec/trivy image --severity HIGH,CRITICAL
                ${{ env.DOCKERHUB_USERNAME }}/shorty-api:${{env.TAG}}
            - run: docker compose push api front
            